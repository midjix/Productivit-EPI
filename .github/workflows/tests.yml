name: Tests

# Intégration continue : la suite PHPUnit est rejouée à chaque push et pull request,
# contre une vraie MariaDB (même moteur qu'en production) et non SQLite, pour que
# les contraintes d'unicité, les décimaux et les clés étrangères soient testés tels quels.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (MariaDB 12.3)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        # Sur un runner froid, l'initialisation d'InnoDB peut dépasser 50 s : délai de
        # grâce + 12 tentatives (≈ 2 min) pour ne pas échouer avant même de tester
        # (run 39931178359 du 23/10/2026 : « Initialize containers » en échec, tests non lancés).
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-start-period=20s
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    # root : le test du connecteur EpiLogg crée une base dédiée `testing_epilogg`
    # (reproduction du schéma réel), ce que l'utilisateur applicatif n'a pas le droit de faire.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lancer les tests
        run: php artisan test --without-tty
